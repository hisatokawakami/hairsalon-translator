<!DOCTYPE html>

<head>

  <script>
    $(function () {
      $('.menu-btn').click(function () {

  });

<style>
/* 項目をカード風ではなくシンプルなリストに変更し、文字サイズを小さくする */
.advice-sentence {
  margin: 20px auto;
  max-width: 100%;
  list-style: none;
  padding: 0;
}

.advice-sentence li {
  background: none !important;
  border: none !important;
  box-shadow: none !important;
  padding: 8px 0 !important;
  margin: 0 !important;
  font-size: 0.95rem; /* 文字サイズを小さく調整 */
  line-height: 1.5;
}

.advice-sentence p {
  margin: 0;
}

.advice-ja {
  cursor: pointer;
}
.english-original {
  margin: 2px 0 8px 0 !important;
  padding-left: 24px;
  font-size: 0.88rem;
  line-height: 1.5;
}
.advice-ja:hover {
  text-decoration: underline;
}
#selected-orders:empty {
  display: none;
}

.advice-sentence select {
  font: inherit;
  color: inherit;
  padding: 1px 4px;
  margin: 0 2px;
  border: 1px solid #ccc;
  border-radius: 2px;
  background: #fff;
  font-size: 0.9rem;
}

#selected-orders {
  margin-top: 15px;
  padding-left: 20px; /* 箇条書き用の余白 */
}

/* 下部の選択項目を一文ずつ綺麗な箇条書き（ul/li）形式に */
#selected-orders ul {
  list-style-type: disc !important;
  padding-left: 20px !important;
  margin: 0 !important;
}

.selected-order-item {
  display: list-item !important; /* 確実に箇条書きの点が表示されるようにする */
  margin: 6px 0;
  line-height: 1.6;
  font-size: 0.95rem;
}
</style>

</head>

<body>

      <button type="button" class="menu-btn">menu</button>

</div>

    <div id="kv"></div>

<section id="main">
  <div class="menu">
    <h1>本日のアドバイス</h1>
    <div class="wrap-blk">
      <div class="contents-blk" id="items">
        <ul class="advice-sentence">

            ＜髪質について＞

                <select id="amount-word">

                  <option value="fair">普通な</option>
                </select>ので、
                <select id="quantity-word">
                  <option value="remove some weight">少し毛量を減らします</option>

                </select>。
              </p>

            </label>

          <li class="menu-item-check">

                この

        </ul>
      </div>
    </div>
  </div>

  <div class="order">
    <div class="order-sticky-inner">

</section>

<script>
function toggleRadio(radio) {
  if (radio.dataset.wasChecked === "true") {
    radio.checked = false;
    radio.dataset.wasChecked = "false";
  } else {
    document.querySelectorAll('input[type="radio"][name="' + radio.name + '"]').forEach(function(item) {
      item.dataset.wasChecked = "false";
    });
    radio.checked = true;
    radio.dataset.wasChecked = "true";
  }
}

document.addEventListener("DOMContentLoaded", function() {

  // Existing radio button behavior
  document.querySelectorAll('input[type="radio"]').forEach(function(radio) {
    radio.addEventListener("click", function() {
      toggleRadio(this);
    });
  });

  // Keep the English sentence directly under each Japanese sentence.
  const checkboxes = document.querySelectorAll('.menu-item-check input[type="checkbox"]');
  const selectedOrders = document.getElementById("selected-orders");

  function getEnglishSentence(paragraph) {
    let sentence = paragraph.dataset.en || "";

    paragraph.querySelectorAll("select").forEach(function(select) {
      const selected = select.options[select.selectedIndex];
      const value = selected ? selected.value : "";
      sentence = sentence.replace("[" + select.id + "]", value);
    });

    return sentence;
  }

  function updateEnglishPreviews() {
    document.querySelectorAll(".advice-ja").forEach(function(paragraph) {
      const english = paragraph.parentElement.querySelector(".english-original");
      if (english) {
        english.textContent = getEnglishSentence(paragraph);
      }
    });
  }

  function updateOrder() {
    selectedOrders.innerHTML = "";
    const ul = document.createElement("ul");

    checkboxes.forEach(function(checkbox) {
      if (!checkbox.checked) return;

      const paragraph = checkbox.closest(".menu-item-check").querySelector("p.advice-ja");
      if (!paragraph) return;

      const orderItem = document.createElement("li");
      orderItem.className = "selected-order-item";
      orderItem.textContent = getEnglishSentence(paragraph);
      ul.appendChild(orderItem);
    });

    if (ul.children.length > 0) {
      selectedOrders.appendChild(ul);
    }
  }

  checkboxes.forEach(function(checkbox) {
    checkbox.addEventListener("change", updateOrder);
  });

  document.querySelectorAll(".advice-sentence select").forEach(function(select) {
    select.addEventListener("change", function() {
      updateEnglishPreviews();
      updateOrder();
    });
  });

  updateEnglishPreviews();
  updateOrder();
});
</script>

</body>
</html>
